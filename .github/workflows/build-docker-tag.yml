name: Tag builder
on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup JDK 25
        uses: actions/setup-java@v4.8.0
        with:
          java-version: '25'
          distribution: 'oracle'
          cache: maven

      - name: Set release version from tag
        run: |
          VERSION=${GITHUB_REF_NAME}
          mvn -B versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Build with Maven
        env:
          USERNAME: ${{github.actor}}
          PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B package -s $GITHUB_WORKSPACE/settings.xml --file pom.xml

      - name: Set image name
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository }}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Set APP_NAME
        run: |
          APP_NAME="${GITHUB_REPOSITORY##*/}"
          echo "APP_NAME=${APP_NAME,,}" >> $GITHUB_ENV

      - name: Build and publish a Docker image for ${{ github.repository }}
        uses: macbre/push-to-ghcr@master
        with:
          image_tag: ${{ GITHUB_REF_NAME }}
          image_name: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README with released version
        run: |
          VERSION=${GITHUB_REF_NAME}
          sed -i 's|<version>.*</version>|<version>'"$VERSION"'</version>|' README.md

      - name: Bump to next SNAPSHOT version
        run: |
          CURRENT=${GITHUB_REF_NAME}
          
          # Remove leading v and any suffix like -SNAPSHOT
          CLEAN=${CURRENT#v}
          CLEAN=${CLEAN%%-*}
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          
          mvn -B versions:set \
            -DnewVersion="${NEXT}-SNAPSHOT" \
            -DgenerateBackupPoms=false

      - name: Commit snapshot + README update
        run: |
          CURRENT=${GITHUB_REF_NAME}
          CLEAN=${CURRENT#v}
          CLEAN=${CLEAN%%-*}
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add pom.xml README.md
          git commit -m "chore: release $CLEAN and bump to $NEXT-SNAPSHOT"
          
          git push origin HEAD:master


      - name: Trigger infra update
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.INFRA_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/daureslaurent/Market-Catalog-MS/dispatches \
            -d '{
              "event_type": "helm",
              "client_payload": {
                "branch": "'"${{ github.ref  }}"'",
                "name": "'"${{ env.APP_NAME  }}"'",
                "image": "'"${{ env.IMAGE_NAME  }}"'",
                "tag": "'"${{ GITHUB_REF_NAME }}"'"
              }
            }'
